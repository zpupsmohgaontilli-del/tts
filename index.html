<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indic Humanised AI Voice Studio</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #334155;
      --border: #334155;
      --primary: #f97316;
      --primary-hover: #ea580c;
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 920px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    header {
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    header p {
      color: var(--muted);
      font-size: 0.92rem;
      margin-top: 0.35rem;
    }

    /* 6 Tabs Grid */
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }

    
    @media (max-width: 680px) {
      .tabs {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .tab-btn {
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.75rem 0.85rem;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      text-align: left;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .tab-btn span.sub {
      font-size: 0.74rem;
      font-weight: 400;
      opacity: 0.8;
    }

    .tab-btn:hover {
      border-color: var(--primary);
      color: var(--text);
    }

    .tab-btn.active {
      background: rgba(249, 115, 22, 0.14);
      border-color: var(--primary);
      color: var(--text);
    }

    /* Active Voice Banner */
    .voice-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      background: var(--bg);
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 1rem;
      font-size: 0.85rem;
    }

    .badge {
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 600;
    }

    .badge.ok {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }

    .badge.warn {
      background: rgba(245, 158, 11, 0.15);
      color: var(--warning);
    }

    
    select {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.4rem 0.6rem;
      border-radius: 8px;
      font-size: 0.82rem;
      max-width: 280px;
    }

    /* Text Area */
    textarea {
      width: 100%;
      min-height: 150px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      font-size: 1.05rem;
      line-height: 1.6;
      resize: vertical;
      margin-bottom: 1.2rem;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* Sliders */
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 1.4rem;
    }

    @media (max-width: 680px) {
      .controls-grid {
        grid-template-columns: 1fr;
      }
    }

    .control-box {
      background: var(--bg);
      padding: 0.85rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .control-box label {
      display: flex;
      justify-content: space-between;
      font-size: 0.83rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .control-box label strong {
      color: var(--text);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text);
      margin-top: 0.25rem;
      cursor: pointer;
    }

    /* Action Buttons */
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    button.btn {
      padding: 0.8rem 1.4rem;
      border-radius: 10px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
    }

    button.btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      flex: 1;
      min-width: 180px;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border) !important;
    }

    .btn-secondary:hover {
      background: var(--surface-hover);
    }

    .status-bar {
      margin-top: 1rem;
      font-size: 0.82rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
    </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Indic Humanised AI Voice Studio</h1>
      <p>Pure client-side neural TTS for GitHub Pages — zero API keys, zero backend required.</p>
    </header>

    <!-- 6 Voice Profile Tabs -->
    <div class="tabs" id="tabContainer"></div>

    <!-- Active Voice Detector & Override -->
    <div class="voice-meta">
      <div>
        <span id="voiceStatusBadge" class="badge ok">Detecting Neural Voice...</span>
        <span id="activeVoiceName" style="margin-left: 0.5rem; color: var(--muted);"></span>
      </div>
      <div>
        <label for="voiceOverride" style="font-size: 0.78rem; color: var(--muted); margin-right: 0.4rem;">Engine Voice:</label>
        <select id="voiceOverride"></select>
      </div>
    </div>

    <!-- Script Input -->
    <textarea id="scriptInput" placeholder="Enter your script here..."></textarea>

    <!-- Humanise Controls -->
    <div class="controls-grid">
      <div class="control-box">
        <label>Speaking Pace <strong id="rateVal">0.96x</strong></label>
        <input type="range" id="rateSlider" min="0.6" max="1.4" step="0.02" value="0.96" />
      </div>

      <div class="control-box">
        <label>Vocal Pitch <strong id="pitchVal">1.00</strong></label>
        <input type="range" id="pitchSlider" min="0.7" max="1.3" step="0.02" value="1.00" />
      </div>


      <div class="control-box">
        <label>Humanise Cadence</label>
        <label class="toggle-row">
          <input type="checkbox" id="humaniseToggle" checked />
          Natural breath & clause pauses
        </label>
      </div>
    </div>

    <!-- Playback Controls -->
    <div class="actions">
      <button class="btn btn-primary" id="speakBtn">▶ Speak Humanised Voice</button>
      <button class="btn btn-secondary" id="pauseBtn">⏸ Pause / Resume</button>
      <button class="btn btn-secondary" id="stopBtn">⏹ Stop</button>
    </div>

    <div class="status-bar">
      <span id="statusText">Ready</span>
      <span>Tip: Open in Microsoft Edge or Chrome for best Neural Indian voices.</span>
    </div>
  </div>

  <script>
    const PROFILES = [
      {
        id: "en_male",
        tabTitle: "1. Indian English Male",
        sub: "en-IN • Warm & Clear",
        lang: "en-IN",
        gender: "male",
        preferredKeywords: ["Prabhat", "Ravi", "Rishi", "Male", "Google UK English Male"],
        defaultRate: 0.96,
        defaultPitch: 0.95,
        sampleText: "Namaste! Welcome to our platform. Let me walk you through the details in a calm, natural, and conversational tone."
      },
      {
        id: "en_female",
        tabTitle: "2. Indian English Female",
        sub: "en-IN • Expressive",
        lang: "en-IN",
        gender: "female",
        preferredKeywords: ["Neerja", "Heera", "Veena", "Kavya", "Female", "Google हिन्दी"],
 defaultRate: 0.98,
        defaultPitch: 1.04,
        sampleText: "Hi there! Everything is set up and ready for you. Just type what you would like me to say, and listen to the natural flow."
      },
      {
        id: "hi_male",
        tabTitle: "3. Indian Hindi Male",
        sub: "hi-IN • स्वाभाविक आवाज़",
        lang: "hi-IN",
        gender: "male",
        preferredKeywords: ["Madhur", "Hemant", "Male"],
        defaultRate: 0.95,
        defaultPitch: 0.96,
        sampleText: "नमस्ते! आज मैं आपकी क्या सहायता कर सकता हूँ? आप यहाँ कोई भी वाक्य लिखकर बिल्कुल स्वाभाविक और स्पष्ट आवाज़ में सुन सकते हैं।"
      },
      {
        id: "hi_female",
        tabTitle: "4. Indian Hindi Female",
        sub: "hi-IN • मधुर और स्पष्ट",
        lang: "hi-IN",
        gender: "female",
        preferredKeywords: ["Swara", "Kalpana", "Google हिन्दी", "Female"],
        defaultRate: 0.97,
        defaultPitch: 1.03,
        sampleText: "नमस्कार! हमारी इस सेवा में आपका स्वागत है। यह आवाज़ बिल्कुल इंसानों जैसी सहज और स्वाभाविक सुनाई देती है।"
      },
      {
        id: "mr_male",
        tabTitle: "5. Indian Marathi Male",
        sub: "mr-IN • नैसर्गिक आवाज",
        lang: "mr-IN",
        gender: "male",
        preferredKeywords: ["Manohar", "Male"],
        defaultRate: 0.95,
        defaultPitch: 0.96,
        sampleText: "नमस्कार! तुमचं मनापासून स्वागत आहे. तुम्हाला हवा असलेला मजकूर येथे टाईप करा आणि नैसर्गिक आवाजात ऐका."
      },
      {
        id: "mr_female",
        tabTitle: "6. Indian Marathi Female",
        sub: "mr-IN • स्पष्ट आणि गोड",
        lang: "mr-IN",
        gender: "female",
        preferredKeywords: ["Aarohi", "Female"],
        defaultRate: 0.97,
        defaultPitch: 1.03,
        sampleText: "नमस्कार! मी तुमची कशी मदत करू शकते? कृपया तुमचा संदेश खालील बॉक्समध्ये लिहा आणि प्ले बटण दाबा."
      }
    ];

    let currentProfile = PROFILES[0];
    let availableVoices = [];
    let isPaused = false;

    const tabContainer = document.getElementById("tabContainer");
    const scriptInput = document.getElementById("scriptInput");
    const voiceOverride = document.getElementById("voiceOverride");
    const voiceStatusBadge = document.getElementById("voiceStatusBadge");
    const activeVoiceName = document.getElementById("activeVoiceName");
    const rateSlider = document.getElementById("rateSlider");
    const pitchSlider = document.getElementById("pitchSlider");
    const rateVal = document.getElementById("rateVal");
    const pitchVal = document.getElementById("pitchVal");
    const humaniseToggle = document.getElementById("humaniseToggle");
    const statusText = document.getElementById("statusText");

    // Render 6 Tabs
    function renderTabs() {
      tabContainer.innerHTML = "";
      PROFILES.forEach((profile) => {
        const btn = document.createElement("button");
        btn.className = `tab-btn ${profile.id === currentProfile.id ? "active" : ""}`;
        btn.innerHTML = `<span>${profile.tabTitle}</span><span class="sub">${profile.sub}</span>`;
        btn.onclick = () => selectProfile(profile);
        tabContainer.appendChild(btn);
      });
    }



    // Load System/Browser Voices
    function populateVoices() {
      availableVoices = window.speechSynthesis.getVoices();
      voiceOverride.innerHTML = "";

      availableVoices.forEach((voice, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = `${voice.name} (${voice.lang})`;
        voiceOverride.appendChild(opt);
      });

      matchBestVoiceForProfile(currentProfile);
    }

    // Smart Neural Voice Matcher for Indian English, Hindi, Marathi
    function matchBestVoiceForProfile(profile) {
      if (!availableVoices.length) return;

      const langCode = profile.lang.toLowerCase();
      const shortLang = langCode.split("-")[0];

      // 1. Filter voices matching exact language (e.g. mr-IN, hi-IN, en-IN)
      let candidates = availableVoices.filter(v => v.lang.toLowerCase() === langCode);

      // 2. Fallback to broader language family or Devanagari voice if Marathi isn't installed on OS
      if (candidates.length === 0) {
        candidates = availableVoices.filter(v => v.lang.toLowerCase().startsWith(shortLang));
      }
      if (candidates.length === 0 && shortLang === "mr") {
        // Hindi voices pronounce Devanagari script accurately if mr-IN isn't installed on device
        candidates = availableVoices.filter(v => v.lang.toLowerCase().includes("hi-in"));
      }
      if (candidates.length === 0) {
        candidates = availableVoices.filter(v => v.lang.toLowerCase().includes("in"));
      }
      if (candidates.length === 0) {
        candidates = availableVoices;
      }

      // Prioritize "Natural" / "Online" / specific gender keywords
      let bestVoice = candidates[0];
      for (const kw of profile.preferredKeywords) {
        const found = candidates.find(v => v.name.toLowerCase().includes(kw.toLowerCase()));
        if (found) {
          bestVoice = found;
          break;
        }
      }

      const globalIndex = availableVoices.indexOf(bestVoice);
      if (globalIndex !== -1) {
        voiceOverride.value = globalIndex;
      }

      updateVoiceBadge(bestVoice, profile);
    }

    function updateVoiceBadge(voice, profile) {
      if (!voice) {
        voiceStatusBadge.className = "badge warn";
        voiceStatusBadge.textContent = "No system voices found";
        return;
      }


      const isExactLang = voice.lang.toLowerCase().includes(profile.lang.split("-")[0]);
      const isNeural = /natural|online|neural|google/i.test(voice.name);

      if (isExactLang && isNeural) {
        voiceStatusBadge.className = "badge ok";
        voiceStatusBadge.textContent = "Neural Voice Active";
      } else if (isExactLang) {
        voiceStatusBadge.className = "badge ok";
        voiceStatusBadge.textContent = "Native Voice Active";
      } else {
        voiceStatusBadge.className = "badge warn";
        voiceStatusBadge.textContent = "Fallback Voice (Install language pack for native)";
      }

      activeVoiceName.textContent = `${voice.name} [${voice.lang}]`;
    }

    function selectProfile(profile) {
      window.speechSynthesis.cancel();
      currentProfile = profile;
      scriptInput.value = profile.sampleText;
      rateSlider.value = profile.defaultRate;
      pitchSlider.value = profile.defaultPitch;
      rateVal.textContent = `${profile.defaultRate.toFixed(2)}x`;
      pitchVal.textContent = profile.defaultPitch.toFixed(2);
      renderTabs();
      matchBestVoiceForProfile(profile);
      statusText.textContent = `Switched to ${profile.tabTitle}`;
    }

    // Split text into natural breath clauses for human-like cadence
    function splitIntoHumanClauses(text) {
      if (!humaniseToggle.checked) return [text];
      return text
        .split(/(?<=[.!?।,;:
])\s+/)
        .map(s => s.trim())
        .filter(Boolean);
    }

    function speakText() {
      const rawText = scriptInput.value.trim();
      if (!rawText) {
        statusText.textContent = "Please enter some text first.";
        return;
      }

      window.speechSynthesis.cancel();
      isPaused = false;

      const selectedVoice = availableVoices[voiceOverride.value] || null;
      const baseRate = parseFloat(rateSlider.value);
      const basePitch = parseFloat(pitchSlider.value);
      const clauses = splitIntoHumanClauses(rawText);

      let index = 0;

      function speakNextClause() {
        if (index >= clauses.length) {
          statusText.textContent = "Finished speaking.";
          return;
        }

        const chunk = clauses[index];
        const utterance = new SpeechSynthesisUtterance(chunk);
        if (selectedVoice) utterance.voice = selectedVoice;
        utterance.lang = selectedVoice ? selectedVoice.lang : currentProfile.lang;

        // Subtle micro-variation in pitch/rate when Humanise is enabled so sentences don't sound monotonous
        if (humaniseToggle.checked) {
          const isQuestion = chunk.endsWith("?");
          const microJitter = ((index % 3) - 1) * 0.015;
          utterance.rate = Math.max(0.5, Math.min(2, baseRate + microJitter));
          utterance.pitch = Math.max(0.5, Math.min(2, basePitch + (isQuestion ? 0.05 : microJitter)));
        } else {
          utterance.rate = baseRate;
          utterance.pitch = basePitch;
        }

        utterance.onstart = () => {
          statusText.textContent = `Speaking clause ${index + 1} of ${clauses.length}...`;
        };

        utterance.onend = () => {
          index++;
          // Natural 140ms breath pause between clauses
          const pauseMs = humaniseToggle.checked ? 140 : 0;
          setTimeout(speakNextClause, pauseMs);
        };

        utterance.onerror = (e) => {
          if (e.error !== "interrupted") {
            statusText.textContent = `Playback error: ${e.error}`;
          }
        };

        window.speechSynthesis.speak(utterance);
      }

      speakNextClause();
    }

    // Event Listeners
    rateSlider.addEventListener("input", () => {
      rateVal.textContent = `${parseFloat(rateSlider.value).toFixed(2)}x`;
    });

    pitchSlider.addEventListener("input", () => {
      pitchVal.textContent = parseFloat(pitchSlider.value).toFixed(2);
    });

    voiceOverride.addEventListener("change", () => {
      const v = availableVoices[voiceOverride.value];
      updateVoiceBadge(v, currentProfile);
    });

    document.getElementById("speakBtn").addEventListener("click", speakText);



    document.getElementById("pauseBtn").addEventListener("click", () => {
      if (!window.speechSynthesis.speaking) return;
      if (isPaused) {
        window.speechSynthesis.resume();
        isPaused = false;
        statusText.textContent = "Resumed...";
      } else {
        window.speechSynthesis.pause();
        isPaused = true;
        statusText.textContent = "Paused.";
      }
    });

    document.getElementById("stopBtn").addEventListener("click", () => {
      window.speechSynthesis.cancel();
      isPaused = false;
      statusText.textContent = "Stopped.";
    });

    // Initialize
    if (typeof speechSynthesis !== "undefined") {
      speechSynthesis.onvoiceschanged = populateVoices;
    }
    selectProfile(PROFILES[0]);
    populateVoices();
  </script>
</body>
</html>
